name: Update Google Scholar metrics

# The daily run happens on the owner's Mac (~/scholar-updater/run.sh via launchd),
# because Google Scholar blocks GitHub's servers (HTTP 403). This workflow stays
# as a manual fallback.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scholar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Scholar metrics
        run: python scripts/update_scholar.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- assets/scholar.json README.md; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/scholar.json README.md
          git commit -m "Update Google Scholar metrics"
          git push
