name: Update Google Scholar metrics

on:
  schedule:
    - cron: "17 6 * * *"   # every day, 06:17 UTC
  workflow_dispatch:        # run by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: scholar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Scholar metrics
        run: python scripts/update_scholar.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- assets/scholar.json README.md; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/scholar.json README.md
          git commit -m "Update Google Scholar metrics"
          git push
