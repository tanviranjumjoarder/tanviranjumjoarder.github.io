<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-label="OwlContinuity domino effect: storm, lab moves, memo fails the 48 hour rule, memo moves to Tuesday and passes, professor approves">
