<text x="600" y="206" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#94a3b8">fictional DEMO-101 course · every time gap verified in code</text>
<text x="30" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#f0b45a">OwlContinuity · how one cancelled class cascades</text>
