<text x="364" y="100" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#e2e8f0">Lab moves to Thu</text>
<text x="364" y="132" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#38BDF8">only free slot</text>
<path d="M468 110 l22 0 m-8 -7 l8 7 l-8 7" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
