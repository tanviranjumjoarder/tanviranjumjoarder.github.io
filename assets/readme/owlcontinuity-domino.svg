<g><animate attributeName="opacity" values=".45;.45;1;1;.45" keyTimes="0;0.34;0.39;0.92;1" dur="10s" repeatCount="indefinite"/>
<rect x="498" y="50" width="200" height="120" rx="16" fill="#111a2e" stroke="#f4645a" stroke-width="2"/>
<text x="598" y="100" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#e2e8f0">Memo due 26 h later</text>
<text x="598" y="132" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#f4645a">rule needs 48 h  ✗</text>
<path d="M702 110 l22 0 m-8 -7 l8 7 l-8 7" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
</g>
<g><animate attributeName="opacity" values=".45;.45;1;1;.45" keyTimes="0;0.49;0.54;0.92;1" dur="10s" repeatCount="indefinite"/>
<rect x="732" y="50" width="200" height="120" rx="16" fill="#111a2e" stroke="#10B981" stroke-width="2"/>
<text x="832" y="100" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#e2e8f0">Memo moves to Tue</text>
<text x="832" y="132" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#10B981">123 h later  ✓</text>
<path d="M936 110 l22 0 m-8 -7 l8 7 l-8 7" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
</g>
