<g><animate attributeName="opacity" values=".45;.45;1;1;.45" keyTimes="0;0.04;0.09;0.92;1" dur="10s" repeatCount="indefinite"/>
<rect x="30" y="50" width="200" height="120" rx="16" fill="#111a2e" stroke="#94a3b8" stroke-width="2"/>
<text x="130" y="100" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#e2e8f0">Storm closes campus</text>
<text x="130" y="132" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#94a3b8">simulated notice</text>
<path d="M234 110 l22 0 m-8 -7 l8 7 l-8 7" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
</g>
<g><animate attributeName="opacity" values=".45;.45;1;1;.45" keyTimes="0;0.19;0.24;0.92;1" dur="10s" repeatCount="indefinite"/>
